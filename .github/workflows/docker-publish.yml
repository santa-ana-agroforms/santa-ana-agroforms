name: Docker Container Frontend

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - "Dockerfile"
      - "nginx.conf"
      - "package.json"
      - "yarn.lock"
      - "src/**"
      - "public/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/santa-ana-agroforms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Genera tags y labels automáticamente:
      # - dev branch:   :dev, :dev-<sha>, :sha-<sha>
      # - main branch:  :latest, :<version> si detecta semver (package.json), :sha-<sha>
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev-{{sha}},enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Santa Ana Agroforms (Frontend)
            org.opencontainers.image.description=Vite+React static site served by Nginx with CSP headers
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Habilita caché BuildKit en GitHub Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max
